<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Read {{ book.title }} in SOPDS.">
    <title>{{ book.title }} · SOPDS reader</title>
    <link rel="stylesheet" href="/static/css/reader.css">
    {% if not reader_error %}<script type="module" src="/static/reader/app.js"></script>{% endif %}
  </head>
  <body
    data-reader-root
    data-public-id="{{ book.public_id }}"
    data-source-format="{{ source_format }}"
    data-source-url="{{ source_url }}"
  >
    <a class="reader-skip-link" href="#reader-main">Skip to reader</a>
    <main id="reader-main">
      <section class="reader-message" data-reader-state="loading" role="status" aria-live="polite"{% if reader_error %} hidden{% endif %}>
        <div>
          <h1>{{ book.title }}</h1>
          <p>Preparing the book for reading…</p>
        </div>
      </section>

      <section data-reader-state="reader" data-reader-mode="scroll" aria-label="Book reader" hidden>
        <header data-reader-toolbar role="toolbar" aria-label="Reading controls">
          <strong data-reader-title title="{{ book.title }}">{{ book.title }}</strong>
          <button type="button" data-reader-contents-button aria-controls="reader-contents" aria-expanded="false" disabled>Contents</button>
          <button type="button" data-reader-mode-toggle data-reader-mode="scroll" aria-label="Switch to pages view" disabled>Scroll</button>
          <output data-reader-progress aria-label="Reading progress" aria-live="polite">0%</output>
          <button type="button" data-reader-font-decrease aria-label="Decrease font size" disabled>Smaller text</button>
          <button type="button" data-reader-font-increase aria-label="Increase font size" disabled>Larger text</button>
        </header>
        <button type="button" class="reader-edge-control reader-edge-control--left" data-reader-edge-left data-reader-page-control aria-label="Previous page" hidden>‹</button>
        <button type="button" class="reader-edge-control reader-edge-control--right" data-reader-edge-right data-reader-page-control aria-label="Next page" hidden>›</button>
        <dialog id="reader-contents" data-reader-contents aria-labelledby="reader-contents-title">
          <h2 id="reader-contents-title">Contents</h2>
          <nav aria-label="Book contents" data-reader-contents-navigation></nav>
        </dialog>
        <div data-reader-surface tabindex="0" aria-label="Reading surface"></div>
        <nav class="reader-page-dock" data-reader-page-dock data-reader-page-control hidden aria-label="Page navigation">
          <button type="button" data-reader-previous aria-label="Previous page" disabled>Previous</button>
          <output data-reader-dock-progress aria-label="Reading progress" aria-live="polite">0%</output>
          <button type="button" data-reader-next aria-label="Next page" disabled>Next</button>
        </nav>
      </section>

      <section class="reader-message reader-message--error" data-reader-state="error" role="alert"{% if not reader_error %} hidden{% endif %}>
        <div>
          <h1>Unable to open {{ book.title }}</h1>
          <p data-reader-error-message>{{ reader_error or "The book could not be opened in the web reader." }}</p>
          <nav aria-label="Reader recovery actions">
            <a data-testid="reader-retry" href="{{ retry_url }}" data-reader-retry>Retry</a>
            <a data-testid="reader-download" href="{{ download_url }}" data-reader-download>Download original</a>
            <a data-testid="reader-back" href="{{ detail_url }}" data-reader-back>Back to book</a>
          </nav>
        </div>
      </section>
    </main>
  </body>
</html>
