[dependency-groups]
runtime = [
    "aiogram==3.30.0",
    "babel>=2.17,<3",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.10,<3",
    "tortoise-orm==1.1.8",
    "uvicorn>=0.34,<1",
]
dev = [
    { include-group = "runtime" },
    "httpx2>=2,<3",
    "import-linter>=2.7,<3",
    "mypy>=2.3,<3",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E4",    # pycodestyle import errors
    "E7",    # pycodestyle statement errors
    "E9",    # pycodestyle runtime and syntax errors
    "F",     # Pyflakes
    "I",     # isort import ordering
    "UP",    # pyupgrade syntax modernization
    "B",     # flake8-bugbear correctness checks
    "ASYNC", # flake8-async concurrency checks
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific checks
    "S",     # flake8-bandit security checks
    "PERF",  # Perflint performance checks
    "DTZ",   # flake8-datetimez timezone checks
    "A",     # flake8-builtins shadowing checks
    "PTH",   # flake8-use-pathlib
]

[tool.ruff.lint.isort]
known-first-party = ["sopds"]

[tool.ruff.lint.per-file-ignores]
"src/sopds/db/migrations/**/*.py" = [
    # Tortoise migration classes require class-level mutable operation/dependency declarations.
    "RUF012",
]
"tests/**/*.py" = [
    "S101", # Allow assert statements in tests.
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_code_links = true
enable_error_code = ["deprecated", "explicit-override"]
mypy_path = ["src"]
files = ["src", "tests"]
exclude = ["^src/sopds/db/migrations/"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.importlinter]
root_package = "sopds"

[[tool.importlinter.contracts]]
name = "Presentation adapters must not access persistence"
type = "forbidden"
source_modules = [
    "sopds.web",
    "sopds.opds",
    "sopds.telegram",
]
forbidden_modules = ["sopds.db"]
