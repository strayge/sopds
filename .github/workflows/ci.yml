name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: sopds
          POSTGRES_DB: sopds_ci_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sopds -d sopds_ci_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      PYTHONPATH: src
      SOPDS_TEST_DATABASE_URL: postgresql://sopds@127.0.0.1:5432/sopds_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.dev.freeze.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: python -m pip install -r requirements.dev.freeze.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src tests
      - name: Import boundaries
        run: lint-imports
      - name: Browser behavior tests
        run: node --test tests/*.test.mjs
      - name: Tests
        run: pytest
