services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: sopds
      POSTGRES_USER: sopds
      POSTGRES_HOST_AUTH_METHOD: trust
    command:
      - postgres
      - -c
      - max_connections=10
      - -c
      - shared_buffers=32MB
      - -c
      - work_mem=2MB
    volumes:
      - ./data/db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sopds -d sopds"]
      interval: 5s
      timeout: 5s
      retries: 12

  sopds:
    build:
      context: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./config.toml:/config/config.toml:ro
      - ./library:/library:ro
      - ./data:/data
